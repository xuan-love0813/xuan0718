<!DOCTYPE html>

<html lang="zh-CN">


<head>

<meta charset="UTF-8">

<title>
第二十关｜给宣宣的信
</title>


<link rel="stylesheet" href="../style.css">


</head>



<body>


<!-- 信件背景音乐 -->

<audio id="letterMusic" loop>

<source src="../music/letter.mp3" type="audio/mpeg">

</audio>




<div class="mission-page">


<div class="task-box final-box">



<h1 class="task-title">

💌 第二十关：最后的礼物

</h1>





<!-- 帕恰狗图片 -->

<img 
src="../images/pachacco.png"
class="pachacco">





<div 
class="envelope"
onclick="openLetter()">

💌

</div>





<p class="story">

点击信封，

<br>

打开最后的惊喜。

</p>





<div id="flower-container"></div>





<div id="letter" class="letter">


<p id="letterText"></p>




<div id="ending" class="ending">

🌱

<br>

谢谢你来到我的世界

<br><br>

🐶💚

<br><br>

纪念日快乐，我爱你。

</div>




</div>





</div>


</div>







<script>


let text =

`
亲爱的宣宣：

这是我提前很久很久为你准备的一个惊喜，希望这个礼物能给你带来一些小温暖，也希望你可以喜欢这个礼物。

关于这个礼物准备的理由，我想可能是因为你和我实在太不同了吧，我不知道用怎么样的方式来表达我的感情，那就准备这样一个小小的惊喜吧。

宣宣，和你相遇真的是我这几年最幸运、最幸福的事情。

你为我做的所有事情我都看在眼里、记在心里。

我常常想，宣宣是个很好的人，我也是，所以我们才会这样相遇，然后在一起。

我有时候会想，宣宣是个有点笨的人。

你总为我花钱、为我买东西，在这个过程中，我总是觉得自己对你有亏欠。

可是你也没有在意这些，依旧一直对我很好。

还好我们两个都是善良的人。

不然这个笨宣宣就要被人卖了还帮人数钱了。

我知道我和你在一起之后，你颠覆了一些对我的印象。

我不如刚相处时那么平易近人，也没有一直照顾别人的情绪。

因为在你面前，我就是一个肆无忌惮的小孩。

谢谢你一直包容我的小脾气。

谢谢你一直给我最大的耐心。

对呀，我们宣宣怎么这么好、这么可爱呢？

是你让小熊维尼变得可爱。

是你让我有了环游世界的想法。

也是你让我有了一些可以叛逆的勇气。

亲爱的宣宣，

这才是我们在一起的第一年。

但是我已经因为你做出了很多很好、很积极的改变。

我也希望未来的每一年，

我们都可以继续陪伴彼此。

和你在一起，

是我最大最大的幸福。

这句话我还会说很多很多次。

因为我相信，

未来一定会比现在更加幸福。

纪念日快乐。

我爱你。
`;





let index = 0;





function openLetter(){



// 隐藏信封

document
.querySelector(".envelope")
.style.display="none";




// 播放音乐

document
.getElementById("letterMusic")
.play();




// 显示信件

document
.getElementById("letter")
.style.display="block";




// 玉兰花效果

createFlowers();




// 开始文字动画

showText();



}






function showText(){



if(index < text.length){


document
.getElementById("letterText")
.innerHTML += text[index];


index++;


setTimeout(showText,70);


}

else{


document
.getElementById("ending")
.style.display="block";


}


}







function createFlowers(){


for(let i=0;i<25;i++){


let flower=document.createElement("div");


flower.innerHTML="🌸";


flower.className="flower";



flower.style.left=

Math.random()*100+"%";



flower.style.animationDuration=

(3+Math.random()*5)+"s";



document
.getElementById("flower-container")
.appendChild(flower);



}


}




</script>



</body>


</html>
