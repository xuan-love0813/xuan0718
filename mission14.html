<!DOCTYPE html>

<html lang="zh-CN">


<head>

<meta charset="UTF-8">


<title>
第十四关｜时间密码
</title>


<link rel="stylesheet" href="../style.css">


</head>



<body>



<div class="mission-page">


<div class="task-box">



<h1 class="task-title">

🔐 第十四关：时间密码

</h1>




<p class="story">

Pochacco 找到了一封被锁住的小信。

<br>

锁上没有名字，

<br>

只有一个等待解开的密码。

<br><br>

它记录着一个特别的日子。

</p>




<div class="password-box">


🔒

<br>

?

&nbsp;&nbsp;?

&nbsp;&nbsp;?

&nbsp;&nbsp;?


</div>




<p class="story">

提示：

<br>

“这是属于我们的纪念日。”

</p>




<input

id="answer"

class="answer-box"

placeholder="请输入四位数字">



<br><br>



<button onclick="checkAnswer()">

解锁

</button>




<p

id="result"

class="success">

</p>




<div class="tip">

🐶：

“有些日期，

<br>

不是日历上的一天，

<br>

而是故事开始的证明。”

</div>




</div>


</div>






<script>


function checkAnswer(){



let answer =

document
.getElementById("answer")
.value;



let result =

document
.getElementById("result");



if(answer === "0813"){



result.innerHTML =


`

🌱 解锁成功！

<br><br>


0813

<br><br>


这是属于我们的纪念日。

<br>

也是我们的故事，

<br>

开始被认真记录的一天。

<br><br>


<a href="mission15.html">

进入下一关 →

</a>


`;



}

else{


result.innerHTML =


`

🐶 密码不正确哦～

<br><br>

提示：

<br>

八月十三日

`;



}



result.style.display="block";


}



</script>



</body>


</html>
